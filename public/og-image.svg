<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    
    <!-- Logo gradient -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    
    <!-- Glow effect for logo -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(249,115,22,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="rgba(249,115,22,0.03)"/>
  <circle cx="1100" cy="530" r="250" fill="rgba(249,115,22,0.03)"/>
  
  <!-- Main content container -->
  <g transform="translate(600, 280)">
    <!-- Logo with glow -->
    <g transform="translate(-200, -80)" filter="url(#glow)">
      <rect x="0" y="0" width="140" height="140" rx="28" ry="28" fill="url(#logoGradient)"/>
      <!-- Lucide Zap icon - stroke style matching the app header -->
      <g transform="translate(35, 26) scale(2.9)">
        <path 
          d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" 
          fill="none" 
          stroke="white" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round"
        />
      </g>
    </g>
    
    <!-- App name -->
    <text x="-30" y="-20" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="white">
      Sat Sorter
    </text>
    
    <!-- Tagline -->
    <text x="-30" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">
      Zero-based budgeting on a Bitcoin standard
    </text>
    
    <!-- Subtext -->
    <text x="-30" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#64748b">
      Give every sat a job • Private • Lightning-ready
    </text>
  </g>
  
  <!-- Bitcoin symbol decorations -->
  <text x="50" y="580" font-family="system-ui, sans-serif" font-size="32" fill="rgba(249,115,22,0.2)">₿</text>
  <text x="1120" y="80" font-family="system-ui, sans-serif" font-size="48" fill="rgba(249,115,22,0.15)">₿</text>
  
  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="#f97316"/>
</svg>
