<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>Sat Sorter - Bitcoin Budget App</title>
    <meta name="title" content="Sat Sorter - Bitcoin Budget App" />
    <meta name="description" content="Zero-based budgeting on a Bitcoin standard. Give every sat a job. Private, secure, and works offline." />

    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Sat Sorter" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS 27 draws a system progressive blur over the top of standalone PWAs
         that use black-translucent status bars (no web-facing opt-out exists —
         see WebKit/PWA reports). "default" avoids it. iOS samples the page's
         top pixels to tint the status bar, so the fixed plate div in <body>
         keeps the status bar matching the app theme.
         NOTE: this setting is frozen at PWA install time — users must re-add
         the app to their Home Screen after this change. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sat Sorter" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#D9662E" />
    <meta name="msapplication-TileColor" content="#D9662E" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Content Security Policy -->
    <meta http-equiv="content-security-policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self' https:; font-src 'self'; base-uri 'self'; manifest-src 'self'; connect-src 'self' blob: https: wss:; img-src 'self' data: blob: https:; media-src 'self' https:">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sat Sorter - Bitcoin Budget App" />
    <meta property="og:description" content="Zero-based budgeting on a Bitcoin standard. Give every sat a job." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Sat Sorter - Bitcoin Budget App" />
    <meta property="twitter:description" content="Zero-based budgeting on a Bitcoin standard. Give every sat a job." />
  </head>
  <body>
    <!-- iOS status-bar tint plate: a real element at the very top so iOS's
         status-bar color sampler picks up the app theme (pseudo-elements are
         invisible to the sampler). Kept at 1px + z-max + pointer-events none
         so it never interferes with the app. -->
    <div aria-hidden="true" style="position:fixed;top:0;left:0;right:0;height:1px;background:hsl(var(--brand));z-index:9999;pointer-events:none;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
