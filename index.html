<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>Sat Sorter - Bitcoin Budget App</title>
    <meta name="title" content="Sat Sorter - Bitcoin Budget App" />
    <meta name="description" content="Zero-based budgeting on a Bitcoin standard. Give every sat a job. Private, secure, and works offline." />

    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Sat Sorter" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sat Sorter" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f97316" />
    <meta name="msapplication-TileColor" content="#f97316" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apple Touch Icon - PNG required for iOS -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Content Security Policy -->
    <meta http-equiv="content-security-policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self' https:; font-src 'self'; base-uri 'self'; manifest-src 'self'; connect-src 'self' blob: https: wss:; img-src 'self' data: blob: https:; media-src 'self' https:">

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://satsorter.com/" />
    <meta property="og:title" content="Sat Sorter - Bitcoin Budget App" />
    <meta property="og:description" content="Zero-based budgeting on a Bitcoin standard. Give every sat a job. Private, secure, and Lightning-ready." />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sat Sorter - Zero-based budgeting on a Bitcoin standard" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://satsorter.com/" />
    <meta name="twitter:title" content="Sat Sorter - Bitcoin Budget App" />
    <meta name="twitter:description" content="Zero-based budgeting on a Bitcoin standard. Give every sat a job. Private, secure, and Lightning-ready." />
    <meta name="twitter:image" content="https://satsorter.com/og-image.svg" />
